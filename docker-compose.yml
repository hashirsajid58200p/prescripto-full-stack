services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prescripto-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=4000
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - prescripto-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prescripto-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - prescripto-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: prescripto-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    env_file:
      - path: ./admin/.env
        required: false
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
      - VITE_CURRENCY=$
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - prescripto-network

networks:
  prescripto-network:
    driver: bridge
